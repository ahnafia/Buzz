services:
  db:
    image: postgres:16
    container_name: myapp-db
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: myapp
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      # IMPORTANT: inside Docker, "localhost" means the container itself, NOT your machine.
      DB_URL: jdbc:postgresql://db:5432/mydb
      DB_USER: myuser
      DB_PASS: mypass

volumes:
  db_data:
